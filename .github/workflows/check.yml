name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.3.14
      - run: zig version
      - run: zig build check --summary all
      - run: bun tools/check-lock.mjs
      - run: bun tools/reference-stack.mjs
      - run: bun tools/check-codecs.mjs
      - run: bun tools/check-packs.mjs
      - run: bun tools/check-artifacts.mjs
      - run: bun test test/runtime.test.mjs test/workspace-adapter.test.mjs test/bindings.test.mjs test/openai-adapter.test.mjs test/fixture-model-adapter.test.mjs test/live.test.mjs
      - run: bun tools/run.mjs --mode deterministic
      - run: bun tools/run.mjs --mode retry
      - run: bun tools/run.mjs --mode replay
      - run: bun tools/run.mjs --mode measure
